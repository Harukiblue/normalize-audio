name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: pnpm dist:win
            artifact: windows-x64
          - os: ubuntu-latest
            command: pnpm dist:linux
            artifact: linux-x64
          - os: macos-13
            command: pnpm build && electron-builder --mac dmg --x64
            artifact: macos-x64
          - os: macos-14
            command: pnpm build && electron-builder --mac dmg --arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: sermon-audio-cleaner-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
