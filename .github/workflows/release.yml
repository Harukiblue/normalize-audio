name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: pnpm dist:win
            artifact: windows-x64
            artifact_path: release/*-Windows-x64.exe
          - os: ubuntu-latest
            command: pnpm dist:linux
            artifact: linux-x64
            artifact_path: release/*-Linux-x86_64.AppImage
          - os: macos-15-intel
            command: pnpm dist:mac:x64
            artifact: macos-x64
            artifact_path: release/*-macOS-x64.dmg
          - os: macos-15
            command: pnpm dist:mac:arm64
            artifact: macos-arm64
            artifact_path: release/*-macOS-arm64.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: sermon-audio-cleaner-${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
